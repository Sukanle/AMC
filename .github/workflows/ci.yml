name: CI

on:
  push:
    branches: [main, "v0.1.x"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  # Must point at an ABIX revision whose runtime-only package is version 0.3+.
  # Pin this to the ABIX v0.3.0 tag once that release is published.
  ABIX_REF: devel
  LLVM_VERSION: "22"
  ZIG_VERSION: "0.17.0"

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AMC
        uses: actions/checkout@v4

      - name: Checkout ABIX runtime dependency
        uses: actions/checkout@v4
        with:
          repository: Sukanle/ABIX
          ref: ${{ env.ABIX_REF }}
          path: abix-source
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config binutils python3 \
            libfmt-dev libtomlplusplus-dev catch2 liblua5.4-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev \
            libclang-${LLVM_VERSION}-dev libclang-cpp${LLVM_VERSION}-dev libclang-common-${LLVM_VERSION}-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build ABIX runtime package
        run: |
          LLVM_PREFIX="/usr/lib/llvm-${LLVM_VERSION}"
          cmake -S abix-source -B abix-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABIX_BUILD_RUNTIME_ONLY=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_PREFIX_PATH="$LLVM_PREFIX"
          cmake --install abix-build --prefix "$RUNNER_TEMP/abix-runtime"

      - name: Configure and build AMC
        run: |
          LLVM_PREFIX="/usr/lib/llvm-${LLVM_VERSION}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABIX_DIR="$RUNNER_TEMP/abix-runtime/lib/cmake/ABIX" \
            -DCMAKE_PREFIX_PATH="$LLVM_PREFIX;$RUNNER_TEMP/abix-runtime"
          cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Install and smoke
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/amc-install"
          "$RUNNER_TEMP/amc-install/bin/amc" --list-languages | tee languages.txt
          grep -qx cpp languages.txt
          grep -qx rust languages.txt
          grep -qx zig languages.txt

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AMC
        uses: actions/checkout@v4

      - name: Checkout ABIX runtime dependency
        uses: actions/checkout@v4
        with:
          repository: Sukanle/ABIX
          ref: ${{ env.ABIX_REF }}
          path: abix-source
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja llvm@${LLVM_VERSION} fmt tomlplusplus catch2 lua@5.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build ABIX runtime package
        run: |
          PREFIXES="$(brew --prefix llvm@${LLVM_VERSION});$(brew --prefix fmt);$(brew --prefix tomlplusplus);$(brew --prefix catch2);$(brew --prefix lua@5.4)"
          cmake -S abix-source -B abix-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABIX_BUILD_RUNTIME_ONLY=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_PREFIX_PATH="$PREFIXES"
          cmake --install abix-build --prefix "$RUNNER_TEMP/abix-runtime"

      - name: Configure and build AMC
        run: |
          PREFIXES="$(brew --prefix llvm@${LLVM_VERSION});$(brew --prefix fmt);$(brew --prefix tomlplusplus);$(brew --prefix catch2);$(brew --prefix lua@5.4)"
          export PKG_CONFIG_PATH="$(brew --prefix lua@5.4)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABIX_DIR="$RUNNER_TEMP/abix-runtime/lib/cmake/ABIX" \
            -DCMAKE_PREFIX_PATH="$PREFIXES;$RUNNER_TEMP/abix-runtime"
          cmake --build build --parallel 2

      - name: Test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix lua@5.4)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ctest --test-dir build --output-on-failure --timeout 180

      - name: Install and smoke
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/amc-install"
          "$RUNNER_TEMP/amc-install/bin/amc" --list-languages | tee languages.txt
          grep -qx cpp languages.txt
          grep -qx rust languages.txt
          grep -qx zig languages.txt

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout AMC
        uses: actions/checkout@v4

      - name: Checkout ABIX runtime dependency
        uses: actions/checkout@v4
        with:
          repository: Sukanle/ABIX
          ref: ${{ env.ABIX_REF }}
          path: abix-source
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-tomlplusplus
            mingw-w64-ucrt-x86_64-catch
            mingw-w64-ucrt-x86_64-lua54
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build ABIX runtime package
        run: |
          cmake -S abix-source -B abix-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABIX_BUILD_RUNTIME_ONLY=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$MINGW_PREFIX")"
          cmake --install abix-build --prefix "$RUNNER_TEMP/abix-runtime"

      - name: Configure and build AMC
        run: |
          export CMAKE_PREFIX_PATH="$(cygpath -m "$MINGW_PREFIX")"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DABIX_DIR="$(cygpath -m "$RUNNER_TEMP/abix-runtime/lib/cmake/ABIX")" \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$MINGW_PREFIX");$(cygpath -m "$RUNNER_TEMP/abix-runtime")"
          cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Install and smoke
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/amc-install"
          "$RUNNER_TEMP/amc-install/bin/amc.exe" --list-languages | tee languages.txt
          grep -qx cpp languages.txt
          grep -qx rust languages.txt
          grep -qx zig languages.txt
