name: CI

on:
  push:
    branches: [main, "v0.1.x"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  # Released ABIX v0.3.0 branch/tag; its runtime-only package is version 0.3.
  ABIX_REF: v0.3.0
  # Minimum supported LLVM/Clang release. CI builds against the minimum while
  # CMake accepts any newer LLVM/Clang installed by the user.
  LLVM_VERSION: "22"
  ZIG_VERSION: "0.17.0"
  # Minimum supported versions of dependencies whose distribution packages are
  # not API-compatible across Ubuntu releases (fmt 9 on Ubuntu 24.04 lacks
  # fmt::println, for example). CI builds these exact versions so the lower
  # bound stays verified; newer installed releases are accepted by CMake.
  FMT_VERSION: "11.2.0"
  TOMLPLUSPLUS_VERSION: "3.4.0"

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AMC
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config binutils python3 git curl \
            catch2 liblua5.4-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${LLVM_VERSION} llvm-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev \
            libclang-${LLVM_VERSION}-dev libclang-cpp${LLVM_VERSION}-dev libclang-common-${LLVM_VERSION}-dev

      - name: Build pinned fmt
        run: |
          curl -fsSL -o fmt.tar.gz "https://github.com/fmtlib/fmt/archive/refs/tags/${FMT_VERSION}.tar.gz"
          tar xzf fmt.tar.gz
          cmake -S "fmt-${FMT_VERSION}" -B fmt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DFMT_TEST=OFF -DFMT_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/fmt"
          cmake --build fmt-build --target install --parallel 2

      - name: Build pinned toml++
        run: |
          curl -fsSL -o tomlplusplus.tar.gz "https://github.com/marzer/tomlplusplus/archive/refs/tags/v${TOMLPLUSPLUS_VERSION}.tar.gz"
          tar xzf tomlplusplus.tar.gz
          cmake -S "tomlplusplus-${TOMLPLUSPLUS_VERSION}" -B tomlplusplus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTOMLPLUSPLUS_BUILD_TESTS=OFF -DTOMLPLUSPLUS_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/tomlplusplus"
          cmake --build tomlplusplus-build --target install --parallel 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: dependencies
          key: ${{ runner.os }}-${{ runner.arch }}-amc-deps-${{ env.ABIX_REF }}-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-amc-deps-${{ env.ABIX_REF }}-

      - name: Configure and build AMC
        run: |
          LLVM_PREFIX="/usr/lib/llvm-${LLVM_VERSION}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMC_ABIX_REF="$ABIX_REF" \
            -DCMAKE_PREFIX_PATH="$LLVM_PREFIX;$RUNNER_TEMP/fmt;$RUNNER_TEMP/tomlplusplus"
          cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Install and smoke
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/amc-install"
          "$RUNNER_TEMP/amc-install/bin/amc" --list-languages | tee languages.txt
          grep -qx cpp languages.txt
          grep -qx rust languages.txt
          grep -qx zig languages.txt

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AMC
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja llvm@${LLVM_VERSION} catch2 lua@5.4

      - name: Build pinned fmt
        run: |
          curl -fsSL -o fmt.tar.gz "https://github.com/fmtlib/fmt/archive/refs/tags/${FMT_VERSION}.tar.gz"
          tar xzf fmt.tar.gz
          cmake -S "fmt-${FMT_VERSION}" -B fmt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DFMT_TEST=OFF -DFMT_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/fmt"
          cmake --build fmt-build --target install --parallel 2

      - name: Build pinned toml++
        run: |
          curl -fsSL -o tomlplusplus.tar.gz "https://github.com/marzer/tomlplusplus/archive/refs/tags/v${TOMLPLUSPLUS_VERSION}.tar.gz"
          tar xzf tomlplusplus.tar.gz
          cmake -S "tomlplusplus-${TOMLPLUSPLUS_VERSION}" -B tomlplusplus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTOMLPLUSPLUS_BUILD_TESTS=OFF -DTOMLPLUSPLUS_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/tomlplusplus"
          cmake --build tomlplusplus-build --target install --parallel 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: dependencies
          key: ${{ runner.os }}-${{ runner.arch }}-amc-deps-${{ env.ABIX_REF }}-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-amc-deps-${{ env.ABIX_REF }}-

      - name: Configure and build AMC
        run: |
          PREFIXES="$(brew --prefix llvm@${LLVM_VERSION});$RUNNER_TEMP/fmt;$RUNNER_TEMP/tomlplusplus;$(brew --prefix catch2);$(brew --prefix lua@5.4)"
          export PKG_CONFIG_PATH="$(brew --prefix lua@5.4)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMC_ABIX_REF="$ABIX_REF" \
            -DCMAKE_PREFIX_PATH="$PREFIXES"
          cmake --build build --parallel 2

      - name: Test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix lua@5.4)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          ctest --test-dir build --output-on-failure --timeout 180

      - name: Install and smoke
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/amc-install"
          "$RUNNER_TEMP/amc-install/bin/amc" --list-languages | tee languages.txt
          grep -qx cpp languages.txt
          grep -qx rust languages.txt
          grep -qx zig languages.txt

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout AMC
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-catch
            mingw-w64-ucrt-x86_64-lua54
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            curl
            git

      - name: Build pinned fmt
        run: |
          PREFIX="$(cygpath -m "$RUNNER_TEMP")/fmt"
          curl -fsSL -o fmt.tar.gz "https://github.com/fmtlib/fmt/archive/refs/tags/${FMT_VERSION}.tar.gz"
          tar xzf fmt.tar.gz
          cmake -S "fmt-${FMT_VERSION}" -B fmt-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DFMT_TEST=OFF -DFMT_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build fmt-build --target install --parallel 2

      - name: Build pinned toml++
        run: |
          PREFIX="$(cygpath -m "$RUNNER_TEMP")/tomlplusplus"
          curl -fsSL -o tomlplusplus.tar.gz "https://github.com/marzer/tomlplusplus/archive/refs/tags/v${TOMLPLUSPLUS_VERSION}.tar.gz"
          tar xzf tomlplusplus.tar.gz
          cmake -S "tomlplusplus-${TOMLPLUSPLUS_VERSION}" -B tomlplusplus-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTOMLPLUSPLUS_BUILD_TESTS=OFF -DTOMLPLUSPLUS_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build tomlplusplus-build --target install --parallel 2

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: dependencies
          key: ${{ runner.os }}-${{ runner.arch }}-amc-deps-${{ env.ABIX_REF }}-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-amc-deps-${{ env.ABIX_REF }}-

      - name: Configure and build AMC
        run: |
          export CMAKE_PREFIX_PATH="$(cygpath -m "$MINGW_PREFIX");$(cygpath -m "$RUNNER_TEMP")/fmt;$(cygpath -m "$RUNNER_TEMP")/tomlplusplus"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMC_ABIX_REF="$ABIX_REF" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"
          cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 180

      - name: Install and smoke
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/amc-install"
          "$RUNNER_TEMP/amc-install/bin/amc.exe" --list-languages | tee languages.txt
          grep -qx cpp languages.txt
          grep -qx rust languages.txt
          grep -qx zig languages.txt
