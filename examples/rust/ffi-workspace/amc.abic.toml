[package]
name = "amc_demo"
version = "0.1"

[[import]]
language = "rust"
files = ["provider/src/lib.rs"]
symbols = ["Widget"]

[[adapt]]
native = "Box"
target = "abix_owner_Widget"

[[rust.expose]]
function = "widget_make"
as = "widget_make"

[[rust.expose]]
function = "widget_value"
as = "widget_value"

[[rust.expose]]
function = "widget_live"

[target]
arch = 0
os = 0
abi = 1
pointer_bits = 64
endianness = "little"

[thunks]
output = "provider/src/generated/widget_thunks.rs"

[[export]]
output = "amc_demo.abix"
