[package]
name = "amc_core"
version = "1"

[[import]]
language = "cpp"
flags = [
  "-std=c++17",
  "-I", "include",
  "-I", "dependencies/ABIX/MICS/include",
  "-I", "dependencies/ABIX/MICS/HLMD",
]
files = ["self_types.cpp"]
symbols = [
  "skl::amc::Hash128",
  "skl::amc::Type",
  "skl::amc::Field",
  "skl::amc::Parameter",
  "skl::amc::Function",
  "skl::amc::Symbol",
  "skl::amc::HashRecord",
  "skl::amc::HashDescriptor",
  "skl::amc::CompatibilityRecord",
  "skl::amc::MapOperation",
  "skl::amc::MapRecord",
  "skl::amc::ABIModule"
]

[[export]]
output = "build/amc_core.abix"
