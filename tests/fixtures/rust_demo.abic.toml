[package]
name = "rust_demo"
version = "0.1"

[[import]]
language = "rust"
files = ["rust_demo.rs"]
symbols = [
    "RustPoint",
    "RustRect",
    "RustColor",
    "RustBuffer",
    "RustIntPtrs",
    "RustArray",
    "RustTransparent",
    "RustHandle",
    "RustSmallColor",
    "RustAligned",
    "rust_make_rect",
    "rust_rect_area",
    "rust_shade",
    "rust_buffer_len",
    "rust_touch",
]

[target]
arch = 1
os = 1
abi = 1
pointer_bits = 64
endianness = "little"

[[export]]
output = "rust_demo.abix"
