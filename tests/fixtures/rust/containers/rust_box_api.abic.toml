[package]
name = "rust_box_api"
version = "0.1"

[[import]]
language = "rust"
files = ["rust_box_api.rs"]
symbols = ["BoxWidget", "box_widget_destroy", "box_widget_live"]

[[adapt]]
native = "Box"
target = "*mut BoxWidget"

[[owned]]
type = "BoxWidget"
create = "box_widget_make"
destroy = "box_widget_destroy"

[[contract]]
function = "box_widget_make"
returns = "owned"
release = "box_widget_destroy"

[[contract]]
function = "box_widget_value"
params = ["owned"]

[[rust.expose]]
function = "box_widget_make"
as = "box_widget_make"

[[rust.expose]]
function = "box_widget_value"
as = "box_widget_value"

[target]
arch = 0
os = 0
abi = 1
pointer_bits = 64
endianness = "little"

[thunks]
output = "box_thunks.rs"

[[export]]
output = "rust_box_api.abix"
